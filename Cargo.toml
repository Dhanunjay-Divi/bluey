[workspace]
# `members` is the full set in this shared repo (the meeting app AND the
# managed-AI dashboard cluster). `default-members` is the meeting app's live
# closure only (cli/daemon/meeting-overlay + their deps), so a bare
# `cargo build`/`clippy`/`test` — and an AI agent's working set — stay focused
# on the meeting app. The dashboard cluster (cue-dashboard + its deps
# cue-router, cue-stealth) is still a member: build it explicitly with
# `-p cue-dashboard`, and packaging/other branches are unaffected.
members = [
    "crates/cue-cli",
    "crates/cue-core",
    "crates/cue-daemon",
    "crates/cue-dashboard",
    "crates/cue-llm",
    "crates/cue-mcp",
    "crates/cue-stealth",
    "crates/cue-rag",
    "crates/cue-cloud-client",
    "crates/cue-router",
    "crates/cue-agent-bridge",
    "crates/cue-meeting-overlay",
    "crates/cue-transcribe",
    "crates/cue-diarize",
]
default-members = [
    "crates/cue-cli",
    "crates/cue-core",
    "crates/cue-daemon",
    "crates/cue-llm",
    "crates/cue-mcp",
    "crates/cue-rag",
    "crates/cue-cloud-client",
    "crates/cue-agent-bridge",
    "crates/cue-meeting-overlay",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.10"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
uuid = { version = "1.18", features = ["v4", "serde"] }
getrandom = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

# Phase 3 — audio + STT
cpal = "0.15"
ringbuf = "0.4"
webrtc-vad = "0.4"
bytemuck = "1"
async-trait = "0.1"
futures-util = "0.3"
futures = "0.3"
async-stream = "0.3"
parking_lot = "0.12"

# ACP — Agent Client Protocol (JSON-RPC over stdio). Official Zed Industries SDK
# (Apache-2.0). The main crate already bundles the tokio-based `AcpAgent`
# subprocess spawner + `Stdio` transport (re-exported from its own
# `acp_agent`/`stdio` modules), so the separate `agent-client-protocol-tokio`
# helper is NOT needed — and that helper pins an older schema (0.12 vs 0.14's
# 0.13.6), so depending on it would cause a version skew. Default features only
# → stable protocol v1 surface (no `unstable_*` features).
agent-client-protocol = "0.14"
thiserror = "1.0"
zerocopy = { version = "0.8", features = ["derive"] }
keyring = "2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
url = "2.5"
wiremock = "0.6"
obfstr = "0.4"
tempfile = "3"

[profile.release]
# Client hardening / distribution posture:
# strip symbol tables and use thin LTO so shipped binaries expose less
# incidental implementation detail. This is friction, not a security boundary.
strip = "symbols"
lto = "thin"
codegen-units = 1
