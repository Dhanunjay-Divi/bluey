# Release workflow for Bluey.
#
# Artifact naming convention (keep in sync with):
#   - Makefile (package-* targets)
#   - infra/homebrew/bluey.rb
#   - infra/scoop/bluey.json
#   - INSTALL.md
#
# Canonical pattern: bluey-{version}-{os}-{arch}.{ext}
#   os:   darwin | windows | linux
#   arch: arm64 | x86_64
#   ext:  tar.gz (unix) | zip (windows)
#
# Binary names (from Cargo.toml [[bin]] entries):
#   - cue-daemon crate produces: "cue-daemon" and "bluey-daemon"
#   - cue-cli crate produces: "cue" and "bluey"
# We package the "bluey" / "bluey-daemon" variants.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          # v0.1.0 GA scope is macOS arm64 only. Re-enable the other
          # platforms after R13.5 expands the tested support matrix.
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf build-essential libssl-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Node.js
        if: matrix.os == 'macos-latest'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/cue-dashboard/ui/package-lock.json

      - name: Configure MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Validate calendar OAuth configuration
        shell: bash
        env:
          BLUEY_GOOGLE_CLIENT_ID: ${{ vars.BLUEY_GOOGLE_CLIENT_ID }}
          BLUEY_MICROSOFT_CLIENT_ID: ${{ vars.BLUEY_MICROSOFT_CLIENT_ID }}
        run: |
          test -n "$BLUEY_GOOGLE_CLIENT_ID" || {
            echo "::error::Repository variable BLUEY_GOOGLE_CLIENT_ID is required"
            exit 1
          }
          test -n "$BLUEY_MICROSOFT_CLIENT_ID" || {
            echo "::error::Repository variable BLUEY_MICROSOFT_CLIENT_ID is required"
            exit 1
          }
          case "$BLUEY_GOOGLE_CLIENT_ID" in
            ?*.apps.googleusercontent.com) ;;
            *)
              echo "::error::BLUEY_GOOGLE_CLIENT_ID is not a Google OAuth client ID"
              exit 1
              ;;
          esac
          if [[ ! "$BLUEY_MICROSOFT_CLIENT_ID" =~ ^[[:xdigit:]]{8}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{4}-[[:xdigit:]]{12}$ ]]; then
            echo "::error::BLUEY_MICROSOFT_CLIENT_ID must be an application GUID"
            exit 1
          fi
          if [ "$BLUEY_MICROSOFT_CLIENT_ID" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::error::BLUEY_MICROSOFT_CLIENT_ID cannot be the nil GUID placeholder"
            exit 1
          fi

      - name: Configure macOS helper signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          BLUEY_CODESIGN_P12_BASE64: ${{ secrets.BLUEY_MACOS_CODESIGN_P12_BASE64 }}
          BLUEY_CODESIGN_P12_PASSWORD: ${{ secrets.BLUEY_MACOS_CODESIGN_P12_PASSWORD }}
          BLUEY_AUDIO_PROFILE_BASE64: ${{ secrets.BLUEY_MACOS_AUDIO_PROVISIONING_PROFILE_BASE64 }}
          BLUEY_REQUIRE_PERSISTENT_CAPTURE: ${{ vars.BLUEY_REQUIRE_PERSISTENT_CAPTURE_ENTITLEMENT }}
        run: |
          require_persistent="${BLUEY_REQUIRE_PERSISTENT_CAPTURE:-0}"
          case "$require_persistent" in
            0|1) ;;
            *)
              echo "::error::BLUEY_REQUIRE_PERSISTENT_CAPTURE_ENTITLEMENT must be 0 or 1"
              exit 1
              ;;
          esac

          if [ -z "$BLUEY_CODESIGN_P12_BASE64" ] || \
             [ -z "$BLUEY_CODESIGN_P12_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$require_persistent" = "1" ]; then
              echo "::error::Tagged macOS releases and restricted entitlements require BLUEY_MACOS_CODESIGN_P12_BASE64 and BLUEY_MACOS_CODESIGN_P12_PASSWORD"
              exit 1
            fi
            echo "::warning::No macOS signing certificate configured; manual build will use an ad-hoc helper signature"
            echo "BLUEY_CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "BLUEY_REQUIRE_STABLE_CODESIGN=0" >> "$GITHUB_ENV"
            echo "BLUEY_REQUIRE_PERSISTENT_CAPTURE_ENTITLEMENT=0" >> "$GITHUB_ENV"
            exit 0
          fi

          umask 077
          keychain="$RUNNER_TEMP/bluey-signing.keychain-db"
          certificate="$RUNNER_TEMP/bluey-signing.p12"
          keychain_password="$(uuidgen)"
          keep_keychain=0
          cleanup_signing_setup() {
            rm -f "$certificate"
            if [ "$keep_keychain" != "1" ]; then
              security delete-keychain "$keychain" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_signing_setup EXIT

          printf '%s' "$BLUEY_CODESIGN_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$BLUEY_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"

          identity="$(
            security find-identity -v -p codesigning "$keychain" \
              | awk '/^[[:space:]]*[0-9]+\\)/ { print $2; exit }'
          )"
          test -n "$identity" || {
            echo "::error::The imported PKCS#12 contains no usable code-signing identity"
            exit 1
          }

          echo "BLUEY_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "BLUEY_REQUIRE_STABLE_CODESIGN=1" >> "$GITHUB_ENV"
          echo "BLUEY_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          if [ "$require_persistent" = "1" ]; then
            if [ -z "$BLUEY_AUDIO_PROFILE_BASE64" ]; then
              echo "::error::Persistent Content Capture requires BLUEY_MACOS_AUDIO_PROVISIONING_PROFILE_BASE64"
              exit 1
            fi
            profile="$RUNNER_TEMP/BlueyAudio.provisionprofile"
            profile_plist="$RUNNER_TEMP/BlueyAudio-profile.plist"
            printf '%s' "$BLUEY_AUDIO_PROFILE_BASE64" | base64 --decode > "$profile"
            security cms -D -i "$profile" > "$profile_plist" || {
              echo "::error::BlueyAudio provisioning profile is invalid"
              exit 1
            }
            echo "BLUEY_AUDIO_PROVISIONING_PROFILE=$profile" >> "$GITHUB_ENV"
            echo "BLUEY_REQUIRE_PERSISTENT_CAPTURE_ENTITLEMENT=1" >> "$GITHUB_ENV"
          else
            if [ -n "$BLUEY_AUDIO_PROFILE_BASE64" ]; then
              echo "::warning::Ignoring the audio provisioning profile because the restricted entitlement is disabled"
            fi
            echo "BLUEY_REQUIRE_PERSISTENT_CAPTURE_ENTITLEMENT=0" >> "$GITHUB_ENV"
          fi
          keep_keychain=1

      - name: Build daemon and CLI
        env:
          BLUEY_GOOGLE_CLIENT_ID: ${{ vars.BLUEY_GOOGLE_CLIENT_ID }}
          BLUEY_MICROSOFT_CLIENT_ID: ${{ vars.BLUEY_MICROSOFT_CLIENT_ID }}
        run: >-
          cargo build --release --target ${{ matrix.target }}
          -p cue-daemon -p cue-cli
          --features cue-daemon/parakeet-stt,cue-daemon/cloud-calendar

      - name: Build macOS dashboard app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd crates/cue-dashboard/ui
          npm ci
          cd ..
          cargo install tauri-cli --version "^2.0.0" --locked
          cargo tauri build --release --target ${{ matrix.target }} --bundles app

      - name: Build macOS native helpers
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              audio_swift_triple="arm64-apple-macosx14.0"
              audio_arch="arm64"
              ;;
            x86_64-apple-darwin)
              audio_swift_triple="x86_64-apple-macosx14.0"
              audio_arch="x86_64"
              ;;
            *)
              echo "::error::Unsupported macOS audio target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          shopt -s nullglob
          for helper in native/macos/*/build.sh; do
            case "$helper" in */cue-audio/build.sh) continue ;; esac
            bash "$helper"
          done
          BLUEY_AUDIO_SWIFT_TRIPLE="$audio_swift_triple" \
            bash native/macos/cue-audio/bundle-app.sh \
            "$BLUEY_CODESIGN_IDENTITY"
          BLUEY_EXPECTED_ARCHS="$audio_arch" BLUEY_VERIFY_LAUNCH=1 \
            bash native/macos/cue-audio/verify-app.sh \
            native/macos/cue-audio/.build/BlueyAudio.app
          echo "BLUEY_RELEASE_AUDIO_ARCH=$audio_arch" >> "$GITHUB_ENV"

      - name: Build Windows native helpers
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Push-Location native/windows/cue-overlay; ./build.ps1; Pop-Location
          Push-Location native/windows/cue-audio; ./build.ps1; Pop-Location
          Push-Location native/windows/cue-whisper; ./build.ps1; Pop-Location

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p staging/bin
          # Canonical binary: bluey-daemon (fallback: cue-daemon from same crate)
          cp "target/${{ matrix.target }}/release/bluey-daemon" staging/bin/ 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/cue-daemon" staging/bin/bluey-daemon
          # Canonical binary: bluey (fallback: cue from same crate)
          cp "target/${{ matrix.target }}/release/bluey" staging/bin/ 2>/dev/null || \
            cp "target/${{ matrix.target }}/release/cue" staging/bin/bluey
          # Native helpers. Keep both canonical bluey-* names and legacy cue-*
          # aliases because older dev scripts still probe the cue-* fallback.
          find native \( -name "bluey-*" -o -name "cue-*" -o -name "*.dylib" \) -type f | while read f; do
            if [ -x "$f" ] || [[ "$f" == *.dylib ]]; then
              cp "$f" staging/bin/ 2>/dev/null || true
            fi
          done
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -R native/macos/cue-audio/.build/BlueyAudio.app \
              staging/bin/BlueyAudio.app
            BLUEY_EXPECTED_ARCHS="$BLUEY_RELEASE_AUDIO_ARCH" \
              bash native/macos/cue-audio/verify-app.sh \
              staging/bin/BlueyAudio.app

            APP_SRC=""
            for app_dir in "target/${{ matrix.target }}/release/bundle/macos" "target/release/bundle/macos"; do
              if [ -d "$app_dir" ]; then
                for candidate in "$app_dir"/*.app; do
                  if [ -d "$candidate" ]; then
                    APP_SRC="$candidate"
                    break 2
                  fi
                done
              fi
            done
            if [ -z "$APP_SRC" ]; then
              echo "missing Tauri .app bundle for macOS distribution" >&2
              exit 1
            fi
            cp -R "$APP_SRC" staging/Bluey.app
            mkdir -p staging/Bluey.app/Contents/Resources
            cp staging/bin/bluey staging/Bluey.app/Contents/Resources/bluey-cli
            cp staging/bin/bluey-daemon staging/Bluey.app/Contents/Resources/bluey-daemon
            cp -R staging/bin/BlueyAudio.app \
              staging/Bluey.app/Contents/Resources/BlueyAudio.app
            BLUEY_EXPECTED_ARCHS="$BLUEY_RELEASE_AUDIO_ARCH" \
              bash native/macos/cue-audio/verify-app.sh \
              staging/Bluey.app/Contents/Resources/BlueyAudio.app
            for helper in \
              bluey-overlay-macos cue-overlay-macos \
              bluey-audio-macos cue-audio-macos \
              bluey-whisper-macos cue-whisper; do
              if [ -f "staging/bin/$helper" ]; then
                cp "staging/bin/$helper" "staging/Bluey.app/Contents/Resources/$helper"
              fi
            done
            if [ -d "target/release/BlueyOverlay.app" ]; then
              cp -R "target/release/BlueyOverlay.app" \
                staging/Bluey.app/Contents/Resources/BlueyOverlay.app
            fi

            # The Tauri bundle was signed before the release-only CLI, daemon,
            # helper executables, and nested apps were copied into Resources.
            # Re-sign the completed code graph so the outer resource seal covers
            # the exact artifact that is archived and published. Preserve nested
            # bundle identifiers and TCC entitlements while rotating signatures.
            codesign_args=(
              --force
              --deep
              --options runtime
              --preserve-metadata=identifier,entitlements
              --sign "$BLUEY_CODESIGN_IDENTITY"
            )
            if [ "$BLUEY_CODESIGN_IDENTITY" != "-" ]; then
              codesign_args+=(--timestamp)
            fi
            codesign "${codesign_args[@]}" staging/Bluey.app
            codesign --verify --deep --strict --verbose=2 staging/Bluey.app
            BLUEY_EXPECTED_ARCHS="$BLUEY_RELEASE_AUDIO_ARCH" \
              BLUEY_VERIFY_LAUNCH=1 \
              bash native/macos/cue-audio/verify-app.sh \
              staging/Bluey.app/Contents/Resources/BlueyAudio.app
          fi
          tar -czf "bluey-${VERSION}-${{ matrix.platform }}.tar.gz" -C staging .

      - name: Remove macOS signing material
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${BLUEY_CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$BLUEY_CODESIGN_KEYCHAIN" || true
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force staging/bin
          # Canonical binary: bluey-daemon.exe (fallback: cue-daemon.exe)
          if (Test-Path "target/${{ matrix.target }}/release/bluey-daemon.exe") {
            Copy-Item "target/${{ matrix.target }}/release/bluey-daemon.exe" staging/bin/
          } else {
            Copy-Item "target/${{ matrix.target }}/release/cue-daemon.exe" staging/bin/bluey-daemon.exe
          }
          # Canonical binary: bluey.exe (fallback: cue.exe)
          if (Test-Path "target/${{ matrix.target }}/release/bluey.exe") {
            Copy-Item "target/${{ matrix.target }}/release/bluey.exe" staging/bin/
          } else {
            Copy-Item "target/${{ matrix.target }}/release/cue.exe" staging/bin/bluey.exe
          }
          # Native helpers
          Copy-Item native/windows/cue-overlay/build/bluey-overlay.exe staging/bin/ -ErrorAction SilentlyContinue
          Copy-Item native/windows/cue-overlay/build/cue-overlay.exe staging/bin/ -ErrorAction SilentlyContinue
          Copy-Item native/windows/cue-audio/build/bluey-audio.exe staging/bin/ -ErrorAction SilentlyContinue
          Copy-Item native/windows/cue-audio/build/cue-audio.exe staging/bin/ -ErrorAction SilentlyContinue
          Copy-Item native/windows/cue-whisper/cue-whisper.exe staging/bin/ -ErrorAction SilentlyContinue
          Compress-Archive -Path staging/* -DestinationPath "bluey-${VERSION}-${{ matrix.platform }}.zip"

      - name: Compute SHA256
        id: sha
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILE="bluey-${VERSION}-${{ matrix.platform }}"
          if [ -f "${FILE}.tar.gz" ]; then
            echo "sha256=$(shasum -a 256 ${FILE}.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "file=${FILE}.tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "sha256=$(shasum -a 256 ${FILE}.zip | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "file=${FILE}.zip" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluey-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: ${{ steps.sha.outputs.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Need the repo checked out so infra/scripts/build-sha256-manifest.py
      # is available in the runner workspace.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256 manifest
        shell: bash
        run: |
          cd artifacts
          # Generate both human-readable and machine-readable SHA256 manifests.
          # bump-formulae.sh consumes sha256-manifest.json in post-release.
          for f in *; do shasum -a 256 "$f"; done | tee ../SHA256SUMS.txt
          cd ..
          python3 infra/scripts/build-sha256-manifest.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
            SHA256SUMS.txt
            sha256-manifest.json
