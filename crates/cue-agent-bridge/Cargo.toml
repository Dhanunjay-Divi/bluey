[package]
name = "cue-agent-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
futures-util.workspace = true
keyring.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Codex stores MCP servers in TOML (`~/.codex/config.toml` `[mcp_servers.*]`),
# unlike the JSON config every other agent uses. `default-features = false`
# drops the unneeded datetime/preserve-order features (lean binary).
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt", "macros", "rt-multi-thread"] }
# Test-only: capture the structured `unrecognized_format` drift warning so the
# format-drift canary is asserted, not just hoped for. Not a runtime dependency.
tracing-subscriber.workspace = true
wiremock.workspace = true
