[package]
name = "cue-daemon"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "cue-daemon"
path = "src/main.rs"

[[bin]]
name = "bluey-daemon"
path = "src/bin/bluey-daemon.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
cue-cloud-client = { path = "../cue-cloud-client" }
# Recover the user's real shell PATH/env at startup. When the app is launched
# from Finder/Dock (not a terminal), the daemon inherits a minimal PATH and
# would not find the user's installed agents (Homebrew/nvm/etc) or node. The
# crate is git-only (not on crates.io), declared like tauri-nspanel.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "dev" }
thiserror.workspace = true
keyring.workspace = true
parking_lot.workspace = true
async-trait.workspace = true
bytemuck.workspace = true
ringbuf.workspace = true
cpal.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
cue-agent-bridge = { path = "../cue-agent-bridge" }
cue-core = { path = "../cue-core" }
cue-llm = { path = "../cue-llm" }
# Bluey's own MCP memory server (the no-push pivot): the daemon implements the
# MeetingMemorySource trait and mounts the loopback tool surface at startup.
cue-mcp = { path = "../cue-mcp" }
cue-rag = { path = "../cue-rag" }
# On-device streaming ASR engine — the single source of Nemotron-wrapping code.
# Pulls parakeet-rs (with ort-defaults) via its own defaults, so linking is
# satisfied.
cue-transcribe = { path = "../cue-transcribe" }
# On-device speaker diarization (speakrs VBx+PLDA). Optional + behind the
# `diarize` feature: it links OpenBLAS + a native CoreML backend, so it must NOT
# be in the default build. Enable with `--features diarize`.
cue-diarize = { path = "../cue-diarize", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
obfstr.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
hex = "0.4"
sha2 = "0.10"
# Question-detection classifier (SET 1): direct ort session + tokenizer under
# the `local-memory` feature. Same exact ort pin as the rest of the stack so
# cargo unifies on one native runtime.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std"], optional = true }
tokenizers = { version = "0.23", optional = true }

# On-device English STT (NVIDIA Parakeet/Nemotron via ONNX Runtime). CPU-capable;
# the `ort` native lib bundles into the binary, model weights are fetched on first
# run. Behind the `parakeet-stt` feature so the heavy ONNX dependency is opt-in and
# the default build is unaffected. See docs/DECISION-VOICE-STT-STACK.md.
parakeet-rs = { version = "0.3", optional = true, default-features = false }

futures-util.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

# Intel macOS has NO prebuilt ONNX Runtime binary in `ort`, so on that target we
# load ONNX Runtime dynamically at runtime (`load-dynamic`) instead of linking a
# prebuilt. All OTHER targets (Apple Silicon, Windows, Linux) use the native
# prebuilt binaries via `ort-defaults`. See docs/DECISION-VOICE-STT-STACK.md.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
parakeet-rs = { version = "0.3", optional = true, default-features = false, features = [
    "load-dynamic",
] }

[features]
# Opt-in on-device STT backend. Off by default (heavy ONNX dep). The native ONNX
# Runtime (prebuilt binaries) is the default backend; Intel macOS overrides to
# load-dynamic via the per-target dependency above. Speaker labels come from
# cue-diarize (the `diarize` feature), not this STT path.
parakeet-stt = ["dep:parakeet-rs", "parakeet-rs/ort-defaults"]
# On-device speaker diarization via cue-diarize (speakrs). Off by default — pulls
# OpenBLAS + CoreML. Build the daemon with `--features diarize` to enable.
diarize = ["dep:cue-diarize"]
# Cross-meeting facts memory on the local bge-small ONNX embedder (keyless,
# on-device; PLAN-CONTEXT-WARMUP Appendix A/E) + the two-stage question
# detector's ONNX classifier (SET 1). Ships in the MEETING build
# (build-meeting.sh); pair with `parakeet-stt` (which links the ONNX runtime).
local-memory = ["cue-rag/local-embed", "dep:ort", "dep:tokenizers"]
# Real system-calendar reading via EventKit (macOS). Reads the user's connected
# accounts (Outlook/Google/iCloud) through the OS Calendar, so an upcoming
# meeting fires the warm-up trigger. Off by default (macOS-only, needs the TCC
# usage string on the packaged app). Falls back to the env fake / no events.
calendar = ["dep:objc2-event-kit", "dep:block2"]

[dev-dependencies]
# WAV reader for the on-device Parakeet inference smoke test + debug example
# (already in the dependency tree via parakeet-rs; pinned here for test use).
hound = "3.5"

[lints.clippy]
needless_return = "allow"
filter_next = "allow"
needless_question_mark = "allow"
option_as_ref_deref = "allow"
single_char_add_str = "allow"

[[bin]]
name = "overlay-stub"
path = "src/bin/overlay_stub.rs"

[[bin]]
name = "overlay-stub-oneshot"
path = "src/bin/overlay_stub_oneshot.rs"

[[bin]]
name = "system-audio-stub"
path = "src/bin/system_audio_stub.rs"

[[bin]]
name = "overlay-stub-long"
path = "src/bin/overlay_stub_long.rs"

[[bin]]
name = "overlay-stub-crash"
path = "src/bin/overlay_stub_crash.rs"

[[bin]]
name = "whisper-stub"
path = "src/bin/whisper_stub.rs"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.5", optional = true }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-event-kit = { version = "0.2", features = ["EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKParticipant", "EKObject", "EKTypes", "block2"], optional = true }
objc2-foundation = "0.2"
