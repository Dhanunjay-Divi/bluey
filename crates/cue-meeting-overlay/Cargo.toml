[package]
name = "cue-meeting-overlay"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[lib]
name = "cue_meeting_overlay"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` lets us open the WKWebView inspector in debug/capture-visible runs
# to diagnose the native webview (the bundled UI rendering). Has no effect in
# release unless explicitly opened.
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.2"
