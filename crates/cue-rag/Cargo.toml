[package]
name = "cue-rag"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Local ONNX embedder (bge-small via ort) — keyless, on-device semantic memory.
# The ort native runtime is linked by the daemon's parakeet stack; this feature
# only adds the session/tokenizer plumbing (PLAN-CONTEXT-WARMUP Appendix B/E).
local-embed = ["dep:ort", "dep:tokenizers"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Pinned to the exact ort the STT stack links (see cue-transcribe) so cargo
# unifies on ONE native ONNX runtime.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std"], optional = true }
tokenizers = { version = "0.23", optional = true }
# Hybrid retrieval (the mem0 v3 search port): Snowball stemming stands in for
# spaCy lemmatization (same role, consistent across index+query), regex powers
# the POS-free entity extractor.
regex = "1"
rust-stemmers = "1.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
