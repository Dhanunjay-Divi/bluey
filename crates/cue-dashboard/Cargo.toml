[package]
name = "cue-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bluey dashboard window (Tauri 2)"

[[bin]]
name = "cue-dashboard"
path = "src/main.rs"

[lib]
name = "cue_dashboard"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
url = "2"
tauri-plugin-deep-link = "2"
cue-cloud-client = { path = "../cue-cloud-client" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
cue-core = { path = "../cue-core" }
cue-daemon = { path = "../cue-daemon" }
cue-router = { path = "../cue-router" }
futures = "0.3"
async-trait = "0.1"
cue-llm = { path = "../cue-llm" }
cue-stealth = { path = "../cue-stealth" }
cpal.workspace = true
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

objc2 = "0.5"
objc2-foundation = "0.2"
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))']  }
