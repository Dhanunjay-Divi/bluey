<style>
.hx{display:flex;flex-direction:column;height:100%}
.srch{margin:12px 14px 8px;display:flex;align-items:center;gap:9px;height:36px;padding:0 12px;border-radius:var(--r-md);
  background:rgba(255,255,255,.05);border:1px solid var(--hairline)}
.srch input{flex:1;background:none;border:0;outline:0;color:var(--tx-1);font-size:13px;font-family:inherit}
.srch input::placeholder{color:var(--tx-3)}
.srch .k{font-size:10px;color:var(--tx-4);border:1px solid var(--hairline);border-radius:5px;padding:1px 5px;font-family:var(--mono)}
.slist{flex:1;overflow-y:auto;padding:0 8px 10px}
.shd{display:flex;align-items:center;gap:9px;padding:13px 8px 5px}
.shd .t{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3)}
.shd .ln{flex:1;height:1px;background:var(--hairline)}
.srow{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-md);cursor:pointer;border:1px solid transparent}
.srow:hover{background:rgba(255,255,255,.05);border-color:var(--hairline)}
.srow.sel{background:var(--accent-bg);border-color:var(--accent-bg-s)}
.srow .ic{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;color:var(--tx-3);flex:none}
.srow.sel .ic{background:var(--accent-bg-s);color:var(--accent-tx)}
.srow .mid{flex:1;min-width:0}
.srow .ti{font-size:13px;color:var(--tx-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.srow .sub{font-size:11px;color:var(--tx-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.srow .pin{color:var(--tx-4);flex:none;opacity:0}
.srow:hover .pin{opacity:.9}
.srow .pin.on{opacity:1;color:var(--accent-tx)}
.srow .wh{font-size:10px;color:var(--tx-4);flex:none;font-variant-numeric:tabular-nums}
.more{margin:8px 10px 4px;text-align:center;font-size:12px;color:var(--accent-tx);padding:9px;border-radius:var(--r-md);border:1px solid var(--hairline);cursor:pointer}
.more:hover{background:rgba(255,255,255,.04)}
</style>
