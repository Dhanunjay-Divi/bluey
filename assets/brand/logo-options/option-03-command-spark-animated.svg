<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated Bluey command spark logo">
  <defs>
    <linearGradient id="bg3a" x1="9" y1="10" x2="85" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091827"/>
      <stop offset=".55" stop-color="#0D314C"/>
      <stop offset="1" stop-color="#124D6B"/>
    </linearGradient>
    <linearGradient id="accent3a" x1="24" y1="26" x2="74" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AF8FF"/>
      <stop offset="1" stop-color="#5F7CFF"/>
    </linearGradient>
    <filter id="glow3a" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7AF8FF" flood-opacity=".7"/>
    </filter>
  </defs>
  <style>
    .panel { transform-origin: 48px 48px; animation: bluey-panel 2.4s ease-in-out infinite; }
    .prompt { stroke-dasharray: 28; stroke-dashoffset: 28; animation: bluey-prompt 2.4s ease-in-out infinite; }
    .line { stroke-dasharray: 18; stroke-dashoffset: 18; animation: bluey-line 2.4s ease-in-out infinite; }
    .spark { transform-origin: 69px 31px; animation: bluey-spark 2.4s ease-in-out infinite; }
    .pulse { animation: bluey-pulse 2.4s ease-in-out infinite; }
    @keyframes bluey-panel {
      0%, 100% { transform: scale(.92); opacity: .72; }
      18%, 82% { transform: scale(1); opacity: 1; }
    }
    @keyframes bluey-prompt {
      0%, 14% { stroke-dashoffset: 28; opacity: .2; }
      34%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes bluey-line {
      0%, 24% { stroke-dashoffset: 18; opacity: .15; }
      48%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes bluey-spark {
      0%, 35%, 100% { transform: scale(.68) rotate(-14deg); opacity: .45; }
      52%, 72% { transform: scale(1.12) rotate(0deg); opacity: 1; }
    }
    @keyframes bluey-pulse {
      0%, 100% { opacity: .58; }
      52%, 72% { opacity: 1; }
    }
  </style>
  <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#bg3a)"/>
  <rect class="panel" x="22" y="25" width="52" height="42" rx="12" fill="#06111F" stroke="#64E9FF" stroke-width="4" filter="url(#glow3a)"/>
  <path class="prompt" d="M32 39l9 9-9 9" fill="none" stroke="#F5FDFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="line" d="M47 58h17" stroke="url(#accent3a)" stroke-width="6" stroke-linecap="round"/>
  <path class="spark" d="M69 22l2 7 7 2-7 2-2 7-2-7-7-2 7-2 2-7Z" fill="#8BFF9D"/>
  <circle class="pulse" cx="75" cy="70" r="3.5" fill="#7AF8FF"/>
</svg>
