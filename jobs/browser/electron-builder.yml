appId: sh.bluey.jobs.browser
productName: Bluey Browser
artifactName: Bluey-Browser-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - package.json
  - "!node_modules/@bluey/jobs-automation/src{,/**}"
  - "!node_modules/@bluey/jobs-automation/tests{,/**}"
  - "!node_modules/@bluey/jobs-automation/tsconfig.json"
  - "!node_modules/@bluey/jobs-automation/vitest.config.ts"
extraResources:
  - from: browser-bundle
    to: playwright
    filter:
      - "**/*"
asar: true
asarUnpack:
  - "**/node_modules/playwright*/**"
protocols:
  - name: Bluey Jobs
    schemes:
      - bluey-jobs
mac:
  icon: ../../crates/cue-dashboard/icons/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
win:
  icon: ../../crates/cue-dashboard/icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  target:
    - AppImage
