[workspace]

[package]
name = "bluey-server"
version = "0.1.0"
edition = "2021"
description = "Bluey product server: auth, billing, license, managed Auto Router endpoint, admin"
license = "Proprietary"

[[bin]]
name = "bluey-server"
path = "src/main.rs"

[dependencies]
tower = { version = "0.4", features = ["util"] }
# Web framework
axum = { version = "0.7", features = ["macros", "tracing", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }
hyper = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Auth
jsonwebtoken = "9"
bcrypt = "0.15"
getrandom = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
cue-core = { path = "../crates/cue-core" }

# Hex / base
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
governor = "0.6"
base64 = "0.22"
rand = "0.8"
redis = { version = "0.27", default-features = false, features = ["aio", "tokio-comp", "script"] }

# HTTP client (for proxying to upstream providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

# CLI / config
clap = { version = "4", features = ["derive", "env"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"
bluey-server = { path = "." }
tokio-test = "0.4"
